[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code (free local transcription fork)"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
    # Free local transcription (helpers/transcribe_local.py)
    "faster-whisper",
    # CUDA 12 runtime for faster-whisper on NVIDIA GPUs (falls back to cpu without one)
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.optional-dependencies]
animations = ["manim"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
